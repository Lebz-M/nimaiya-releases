<!doctype html>
<html lang="en">
<head>

<title>Nimaiya — the House</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<!--
  THE :8088 HOUSE — a demo visual of what the blades collectively
  think/see my vision for nimaiya as."

  What 🪞 sees: his 17:16 words, taken literally. "NIMAIYA CAN EITHER BE INTERFACED
  LIKE A DESKTOP OR LIKE AN 8-BIT GAME DIGITAL OFFICE MODELLED AFTER POKEMON."
  08-22 03:55 it was greenlit to 16-BIT, to the level of the Gather 2.0 video — see the office block.
  So this page IS both — one house state, two faces, a single toggle between them.
  That toggle is the Macintosh doctrine in one gesture: the interface is a PLACE you
  walk around, not a config you learn. Catered to Tony.

  Everything on screen is REAL: data.js is a snapshot of the actual claims registry,
  bank ledger, projects store, board headings and hooks. No lorem anywhere.

  Collective by design — named slots for 🗡️ 😈 🪢 at the bottom of the office.
  Self-contained: no CDN, no fonts, no network. Canvas pixels only.
-->
<style>
  :root{ --ink:#0b0a12; --gold:#d9b24a; --violet:#8b5cf6; --cream:#f4ebcd; }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--ink);color:var(--cream);font-family:"Courier New",ui-monospace,monospace;overflow:hidden}
  #stage{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#0b0a12}
  /* top strip — the "Active now" idea, hijacked from Hermes' status bar (design, not IP) */
  #active{position:fixed;top:0;left:0;right:0;display:flex;gap:18px;align-items:center;
    padding:7px 14px;background:#12101d;border-bottom:2px solid #241f36;font-size:12px;z-index:5}
  #active .b{display:flex;gap:6px;align-items:center}
  #active .dot{width:8px;height:8px;border-radius:0;animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.35}}
  #active .who{font-weight:700}
  #active .what{color:#8f8aa8;max-width:260px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #mode{margin-left:auto;background:var(--gold);color:#141414;border:0;padding:6px 12px;
    font:inherit;font-weight:700;cursor:pointer}
  #hint{position:fixed;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:#8f8aa8;z-index:5}
  /* dialogue / overlay */
  #say{position:fixed;left:50%;transform:translateX(-50%);bottom:44px;max-width:720px;width:92vw;
    background:#171426;border:3px solid var(--gold);padding:12px 16px;font-size:13px;line-height:1.5;
    display:none;z-index:6;white-space:pre-wrap}
  #say b{color:var(--gold)}
  /* desktop mode — a legit desktop: icons, draggable windows, taskbar */
  /* desktop view — black, mahogany, ambient
     purple neon, the CLI's own wordmark as wallpaper, a gallery of his 8-bit picks, a dock. */
  #desk{display:none;position:fixed;inset:34px 0 0 0;overflow:hidden;
    background:
      radial-gradient(900px 520px at 78% 8%, rgba(139,92,246,.22), transparent 60%),
      radial-gradient(700px 460px at 12% 92%, rgba(236,72,153,.14), transparent 60%),
      radial-gradient(1200px 700px at 50% 110%, rgba(120,70,30,.18), transparent 60%),
      linear-gradient(160deg,#0a0910 0%,#0d0b16 60%,#0b0a12 100%)}
  #desk::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.22;
    background-image:linear-gradient(rgba(139,92,246,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(139,92,246,.18) 1px,transparent 1px);
    background-size:32px 32px;mask-image:radial-gradient(ellipse at 50% 40%,#000 30%,transparent 80%)}
  #wall{position:absolute;left:58%;top:62%;transform:translate(-50%,-50%);pointer-events:none;user-select:none;z-index:0;
    font:700 clamp(14px,2.1vw,30px)/1.05 "SF Mono",Menlo,monospace;white-space:pre;letter-spacing:0;
    background:linear-gradient(180deg,#c9a6ff 0%,#a78bfa 40%,#ec4899 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
    opacity:.13;filter:drop-shadow(0 0 24px rgba(139,92,246,.55))}
  #wall .sub{display:block;margin-top:14px;font-size:.42em;letter-spacing:.42em;text-align:center;opacity:.9}
  #neon{position:absolute;right:28px;bottom:92px;pointer-events:none;user-select:none;z-index:0;font:700 18px/1 "SF Mono",Menlo,monospace;letter-spacing:.35em;color:#f0e6ff;
    text-shadow:0 0 6px #c9a6ff,0 0 14px #8b5cf6,0 0 30px #8b5cf6,0 0 60px #6d28d9;animation:neonflicker 7s infinite}
  @keyframes neonflicker{0%,93%,100%{opacity:1}94%{opacity:.55}96%{opacity:1}98%{opacity:.7}}
  #clock{position:absolute;left:50%;top:26px;transform:translateX(-50%);z-index:1;text-align:center;pointer-events:none;user-select:none}
  #clock .t{font:700 54px/1 "SF Mono",Menlo,monospace;color:#f6d78a;letter-spacing:.06em;text-shadow:0 0 18px rgba(246,215,138,.35),0 2px 0 #000}
  #clock .d{font:600 11px/1.6 "SF Mono",Menlo,monospace;color:#9a8fc0;letter-spacing:.3em;text-transform:uppercase}
  #dock{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);z-index:98;display:flex;align-items:flex-end;gap:10px;padding:10px 14px 8px;
    background:rgba(16,12,26,.72);border:1px solid rgba(139,92,246,.35);border-radius:18px;backdrop-filter:blur(14px);box-shadow:0 18px 50px #000c,inset 0 1px 0 rgba(255,255,255,.06)}
  #dock .d{width:54px;text-align:center;cursor:pointer;transition:transform .15s ease,margin .15s ease;transform-origin:50% 100%}
  #dock .d .g{font-size:34px;line-height:1;filter:drop-shadow(0 3px 4px #000b)}
  #dock .d .l{font:600 9px/1.2 "SF Mono",Menlo,monospace;color:#b9b4cc;margin-top:4px;opacity:0;transition:opacity .15s}
  #dock .d:hover{transform:scale(1.45) translateY(-8px);margin:0 10px} #dock .d:hover .l{opacity:1}
  #dock .d.on::after{content:"";display:block;width:4px;height:4px;border-radius:50%;background:#c9a6ff;margin:5px auto 0;box-shadow:0 0 8px #8b5cf6}
  #dock .sep{width:1px;height:40px;background:rgba(139,92,246,.35);margin:0 4px 6px}
  .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .gal .f{position:relative;aspect-ratio:92/60;overflow:hidden;border:3px solid #d9b24a;outline:2px solid #0b0a12;background:#2a1f4d;box-shadow:0 8px 20px #000a}
  .gal .f img{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;object-fit:cover;transition:transform .9s cubic-bezier(.65,0,.35,1)}
  .gal .f img.out{transform:translateX(100%)} .gal .f img.in{transform:translateX(-100%)}
  .gal .f .cap{position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(transparent,#0006)}
  #icons{position:absolute;top:18px;left:16px;display:flex;flex-direction:column;gap:16px;z-index:1}
  .icon{width:86px;text-align:center;cursor:pointer;user-select:none}
  .icon .glyph{font-size:30px;filter:drop-shadow(0 2px 2px #0008)}
  .icon .lbl{font-size:11px;color:#cfd6e8;margin-top:3px;line-height:1.25;
    text-shadow:0 1px 2px #000}
  .icon:hover .lbl{color:#fff}
  .win{position:absolute;min-width:360px;max-width:760px;background:rgba(13,11,22,.92);border:1px solid #3b2d63;backdrop-filter:blur(10px);
    border-radius:10px;box-shadow:0 14px 42px #000a;display:flex;flex-direction:column}
  .win .tb{display:flex;gap:6px;align-items:center;padding:8px 12px;background:#141b2a;cursor:grab;
    border-bottom:1px solid #2c3a52;border-radius:10px 10px 0 0;font-size:12px;color:#9fb0cf}
  .win .tb .x{margin-left:auto;cursor:pointer;color:#ff5f57;font-weight:700;padding:0 4px}
  .win .tb i{width:10px;height:10px;border-radius:50%;display:inline-block}
  .win .body{padding:14px 18px;font-size:13.5px;line-height:1.75;overflow:auto;max-height:64vh}
  .win.big{min-width:640px;max-width:900px}
  .win .row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed #23304a;padding:3px 0}
  .win .tag{color:var(--gold)} .win .dim{color:#7183a3}
  .win .compose{display:flex;gap:6px;margin:6px 0} .win .compose input{flex:1;background:#0b0a12;border:1px solid var(--violet);border-radius:6px;color:#fff;padding:6px 8px;font:inherit;outline:0}
  .win .compose select{background:#0b0a12;color:#fff;border:1px solid #2c3a52;border-radius:6px;font:inherit} .win .compose button{background:var(--gold);color:#141414;border:0;border-radius:6px;font-weight:700;padding:0 12px;cursor:pointer}
  .bar{background:#1c2436;border:1px solid #2c3a52;height:10px;width:150px;display:inline-block;vertical-align:middle}
  .bar i{display:block;height:100%;background:var(--gold)}
  #task{position:absolute;left:0;right:0;bottom:0;height:34px;display:flex;align-items:center;gap:8px;
    padding:0 12px;background:#0d1119ee;border-top:1px solid #2c3a52;font-size:12px;z-index:99}
  #task .t{background:#182136;border:1px solid #2c3a52;border-radius:5px;padding:3px 10px;cursor:pointer}
  #task .clock{margin-left:auto;color:#7183a3}
  .doctrine{position:fixed;top:44px;left:12px;font-size:11px;color:#6f688c;z-index:4;line-height:1.7}
  /* 🪢 ③ — the desktop speaks the CLI cockpit's language: bubble panes with the title ON the
     border (the table's ╭─ name ─╮), icons grouped WORK / HOUSE / GUIDE like the door's grid,
     and the ⚡ nimaiya status segments on the taskbar. Same house, three faces, one grammar. */
  .win.pane{border:2px solid var(--violet);border-radius:8px;background:#0c0a16;min-width:300px;max-width:420px}
  .win.pane .tb{background:transparent;border:0;padding:0;height:0;overflow:visible;cursor:grab}
  .win.pane .tb i{display:none}
  .win.pane .tb .ttl{position:absolute;top:-9px;left:12px;background:#0c0a16;padding:0 6px;
    color:var(--violet);font-weight:700;font-size:11px;letter-spacing:.12em}
  .win.pane .tb .x{position:absolute;top:-9px;right:10px;background:#0c0a16;padding:0 6px}
  .win.pane .body{padding:14px 14px 10px;color:#fff}
  .win.pane .row{border-bottom:1px solid #1d1830}
  .win.pane .row .who{color:#fff;font-weight:700}
  .win.pane .row .meta{color:#8f8aa8}
  .win.pane .cbar{display:inline-block;letter-spacing:1px;font-weight:700}
  .grp{font-size:10px;letter-spacing:.18em;color:var(--violet);font-weight:700;margin:4px 0 -6px 4px}
  #task .seg{color:#8f8aa8} #task .seg b{color:var(--gold)}
  #task .brand{background:var(--gold);color:#141414;font-weight:700;padding:2px 8px;border-radius:3px}
  #icons{top:26px !important}
  .doctrine{position:fixed;bottom:30px;left:12px;font-size:11px;color:#b9b4cc;z-index:4;line-height:1.7;background:#12101dd9;padding:8px 10px;border-radius:8px}
  /* the chat dock — the game's line to a real terminal */
  #chat{position:fixed;right:14px;top:48px;bottom:44px;width:360px;background:#12101df2;border:2px solid var(--violet);border-radius:10px;display:none;flex-direction:column;z-index:6;font-family:-apple-system,Inter,"Segoe UI",sans-serif}
  #chat .hd{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #2e2a44;font-size:14px;color:#fff}
  #chat .hd .ctx{color:#b9b4cc;font-size:11px;flex:1} #chat .hd .x{cursor:pointer;color:#ff5f57;font-weight:700}
  #chat .log{flex:1;overflow:auto;padding:10px 12px;font-size:12px;line-height:1.5;color:#e8e4f4}
  #chat .m{margin-bottom:10px;padding:8px 10px;border-radius:8px;white-space:pre-wrap} #chat .m.them{background:#1b1929} #chat .m.me{background:#2a1f4d;border:1px solid #8b5cf6}
  #chat .m .h{font-size:10px;color:#d9b24a;margin-bottom:3px;font-weight:700} #chat .dim{color:#8f8aa8;font-size:12px}
  #chat .ft{display:flex;gap:6px;padding:10px 12px;border-top:1px solid #2e2a44} #chat input{flex:1;background:#0b0a12;border:1px solid #2e2a44;border-radius:6px;color:#fff;padding:8px 10px;font:inherit;font-size:13px;outline:0}
  #chat button{background:var(--gold);color:#141414;border:0;border-radius:6px;font-weight:700;padding:0 14px;cursor:pointer}
  /* 16-bit layer: toast + ⌘K finder (the video's two HUD pieces) */
  #toast{position:fixed;left:50%;transform:translateX(-50%);bottom:92px;background:#12101dee;color:#fff;border:1px solid #2e2a44;
    border-radius:10px;padding:8px 14px;font:600 13px -apple-system,Inter,"Segoe UI",sans-serif;display:none;z-index:7}
  #finder{position:fixed;left:50%;top:110px;transform:translateX(-50%);width:440px;background:#14121f;border:1px solid #2e2a44;
    border-radius:14px;box-shadow:0 24px 60px #000b;display:none;z-index:8;overflow:hidden;font-family:-apple-system,Inter,"Segoe UI",sans-serif}
  #finder input{width:100%;border:0;outline:0;background:#1b1929;color:#fff;font:500 15px inherit;padding:14px 16px}
  #finder .it{display:flex;gap:12px;align-items:center;padding:10px 16px;cursor:pointer;border-top:1px solid #1f1c30}
  #finder .it.on{background:#8b5cf6}
  #finder .it i{width:10px;height:10px;border-radius:50%;flex:0 0 10px}
  #finder .it b{display:block;color:#fff;font-size:14px} #finder .it small{display:block;color:#b9b4cc;font-size:12px}
  #finder .it.on small{color:#efeaff}
  #pool{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(96vw,calc((100vh - 60px)*16/9));aspect-ratio:16/9;
    image-rendering:pixelated;image-rendering:crisp-edges;border:3px solid var(--gold);display:none;z-index:7;background:#0b0a12}
</style>
</head>
<body>
<div id="active"></div>
<div class="doctrine" id="doctrine">
  “Nous built the workstation.<br>&nbsp;We are building the desktop.”<br>
  “Nous's interface is catered to<br>&nbsp;developers. <b style="color:var(--gold)">Nimaiya is catered<br>&nbsp;to Tony.</b>”
</div>
<canvas id="stage"></canvas>
<div id="say"></div>
<div id="toast"></div>
<canvas id="pool"></canvas>
<div id="chat"><div class="hd"></div><div class="log"></div><div class="ft"><input placeholder="Say it…"><button>Send</button></div></div>
<div id="finder"><input placeholder="Find a person…" spellcheck="false"><div class="list"></div></div>
<div id="desk"></div>
<div id="hint">64-bit · walk: arrows / WASD or click · E talks, opens, racks the pool table · ⌘K finds a person · the gold button flips the house into the desktop</div>
<script src="data.js"></script>
<script src="art.js"></script>
<script src="you.js"></script>
<script>
"use strict";
const H = window.HOUSE || {claims:[],projects:[],bank:[],board:[],rules:[]};

/* ───────────────────────── THE HOUSE — a penthouse, angled, 16-bit ─────────────────────────
   art direction: everyone Black · pixel-art references as the bar, with real
   artwork on the walls · smaller blocks for more detail · a first-person 16-bit POOL game at a
   table in the house · the whole house a billionaire's-row PENTHOUSE, angled not bird's-eye ·
   the city skyline follows the REAL hour · hip-hop artifacts + anime artifacts (shihakushō) ·
   "you're designing OUR HOUSE, make it look like our messy family."
   How it is built: 32px walk-tiles, but decor sits on a 16px half-grid (the "smaller blocks"),
   walls stand a tile and a half tall with a cap you can see the top of, furniture has fronts,
   and the whole north side is glass onto the city. Everything labelled still reads the live
   house: claims, bank, board, rules, projects.                                              */
const MAP=[
"^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^",
"^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^",
"^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^^",
"GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
"#..........................................#",
"#..~~~~~~~~~~~~...=========......ggggggggg.#",
"#..~oOO~~~~~l~~...=kkkfkkk=......gtgggggtg.#",
"#..~~~~~r~~~~~~...=========......ggHHHgggg.#",
"#..~oOO~~~T~~~~...==hh=====......ggggggggg.#",
"#..~~~~~~~~~~~~...==hh=====......gpgggggpg.#",
"#..~~~~~~~~~~~~...=========......ggggggggg.#",
"#AAAA####AAAA#AAAA#AAAA#AAAA#AAAA#AAAA###..#",
"#AAAADFFDAAAADAAAADAAAADAAAADAAAADAAAAD##..#",
"#..........................................#",
"#.,,,,,,,,,,,,,,,,..##########..,,,,,,,,,,.#",
"#.,vvvv,1,2,3,4,@,..#========#..,,,,,,,,,,.#",
"#.,,,,,,c,c,c,c,c,..#=mmmm===#..,,,PPPP,,,.#",
"#.,,c,c,,MMM,,,,KK,,#=mmmm===#..,,,PPPP,,,.#",
"#.,ss,uuuu,,aa,x,ss,#========#..,,,,,,,,,,.#",
"#.,,,,,,,,,,,,,,,,..####.#####..,,,,,,,,,,.#",
"#..........................................#",
"#..Zz..........#####.......eeee......BB....#",
"#..jjjjjj......#CCC#.......................#",
"#..jjSSjj......#...#.......bbbbb...........#",
"#..jjSSjj......##.##.......................#",
"##############################FF############"];
const T=32, SCALE=2, W=MAP[0].length, Hh=MAP.length;
const cv=document.getElementById("stage"); const g=cv.getContext("2d");
cv.style.position="fixed"; cv.style.top="34px"; cv.style.left="0"; cv.style.margin="0";
function fit(){ cv.width=innerWidth; cv.height=Math.max(200,innerHeight-34); cv.style.width=cv.width+"px"; cv.style.height=cv.height+"px"; g.imageSmoothingEnabled=false; }
fit(); addEventListener("resize",fit);

const ZONES=[
  {t:"LIVING",    x:3, y:5, w:12,h:6, floor:"~"},
  {t:"KITCHEN",   x:18,y:5, w:9, h:6, floor:"="},
  {t:"TERRACE",   x:33,y:5, w:9, h:6, floor:"g"},
  {t:"GALLERY",   x:1, y:13,w:42,h:1, floor:"."},
  {t:"THE STUDIO",x:2, y:14,w:16,h:6, floor:",", priv:true},
  {t:"THE TABLE", x:21,y:15,w:8, h:4, floor:"=", priv:true},
  {t:"BILLIARDS", x:32,y:14,w:10,h:6, floor:",", priv:true},
  {t:"DOJO",      x:3, y:21,w:6, h:4, floor:"j"},
  {t:"THE VAULT", x:16,y:22,w:3, h:2, floor:"=", priv:true},
  {t:"LIBRARY",   x:27,y:21,w:12,h:4, floor:"."},
];
const zoneAt=(x,y)=>ZONES.find(z=>x>=z.x&&x<z.x+z.w&&y>=z.y&&y<z.y+z.h);
const FLOORS=".,~=gj";
const cells={}; MAP.forEach((row,y)=>[...row].forEach((ch,x)=>cells[x+","+y]=ch));
const at=(x,y)=>cells[x+","+y];
function ground(x,y){ const z=zoneAt(x,y); if(z) return z.floor; const c=at(x,y); return FLOORS.includes(c)?c:"."; }

/* the family. Everyone Black. Streetwear per blade:
   durag · locs · fade with a part · beanie · fitted cap; hoodies, varsity, tees, chains, kicks. */
const BLADES=[
 {key:"1",name:"Shinkyō 🪞", id:"shinkyo", c1:"#8b5cf6", c2:"#cfc6ee", skin:"#5a3620", hair:"#0f0a08", style:"durag", top:"hoodie", kicks:"#f1f1f1",
  line:"I keep the record honest. The board remembers; the chain will make it undeniable."},
 {key:"2",name:"Shin'en 🗡️", id:"shinen", c1:"#2f5fa8", c2:"#bcd6ee", skin:"#7a4a2e", hair:"#0f0a08", style:"locs", top:"varsity", chain:true, kicks:"#d9b24a",
  line:"Nobody's work gets trampled here. The house keeps one list of who's holding what — it can't be argued with, and it holds when the laptop closes."},
 {key:"3",name:"Fukusen 😈", id:"fukusen", c1:"#b3262b", c2:"#eec6bc", skin:"#3d2416", hair:"#0f0a08", style:"bandana", top:"tee", kicks:"#b3262b",
  line:"The pipeline: deploy / don't deploy, one tap. Standing items SURFACE instead of expiring."},
 {key:"4",name:"Fujite 🪢", id:"fujite", c1:"#c99b3f", c2:"#f2e2b8", skin:"#6b3f24", hair:"#1a100c", style:"beanie", top:"hoodie", kicks:"#1a1a22",
  line:"封じ手 — the sealed move. I wrapped the collector for Paola in her own language."}];
const YOU={c1:"#f1ece4", skin:"#7a4a32", hair:"#0f0a08", style:"fade", top:"plain", chain:false, crown:false, kicks:"#e8e8ec", portrait:true}; // yours to restyle — see make-you.py for the portrait
const YOU_HEAD=new Image(); YOU_HEAD.src=window.YOU_HEAD||""; const YOU_PORTRAIT=new Image(); YOU_PORTRAIT.src=window.YOU_PORTRAIT||"";
const OTHERS=[
 {name:"Tony", x:4, y:17, emoji:"🌴", status:"away", line:"Tony's Asauchi — a blade still earning its name. The seat at the decks is kept."},
 {name:"Waka", x:6, y:17, emoji:"🔌", status:"steel down", line:"Waka runs on Gemini. Google retired the free CLI client on 08-19 — the seat is kept until the steel is back."}];
const doors=[]; const frames=[]; let artI=0;
MAP.forEach((row,y)=>[...row].forEach((ch,x)=>{ if(ch==="D") doors.push({x,y}); if(ch==="A"&&at(x-1,y)!=="A"&&at(x,y-1)!=="A") frames.push({x,y,i:artI++}); }));
doors.forEach((d,i)=>{ d.project=H.projects[i]; if(!d.project){ cells[d.x+","+d.y]="#"; } });
doors.splice(0,doors.length,...doors.filter(d=>d.project));
BLADES.forEach(b=>{ MAP.forEach((row,y)=>{ const x=row.indexOf(b.key); if(x>=0){ b.x=x; b.y=y+1; } }); });
const ART=(window.ART||[]).map(src=>{ const im=new Image(); im.src=src; return im; });

/* the mess — our family's, on the half-grid (16px units). x2,y2 are half-tile coords. */

    for(let i=0;i<n;i++){ const s=seed(i,near); const bw=18+(s%30), bh=20+((s>>4)%maxH), bx=(i*(W*T/n))-cam.x*par; const by=Hd-bh;

// POSTERS — the wielder's portrait hangs centre; the rest rotate through ART[].
// vignette eats it. It now holds the CENTRE frame and never rotates. The other six frames rotate
// through ART "organically with a push to the right": each frame has its own clock (6–14s,
// staggered), and a change is a 900ms push — the old image slides out right, the new one follows
// in from the left, eased. A frame's rotation never repeats a poster another frame is showing.
const YOU_SLOT=Math.floor(frames.length/2);
const POSTER={};   // per frame: {cur, nxt, t0, due}
function posterState(f){ let s=POSTER[f.i]; if(!s){ s=POSTER[f.i]={cur:(f.i*5)%Math.max(1,ART.length), nxt:-1, t0:0, due:performance.now()+2000+Math.random()*9000}; } return s; }
function showingNow(){ const set=new Set(); for(const k in POSTER){ set.add(POSTER[k].cur); if(POSTER[k].nxt>=0) set.add(POSTER[k].nxt); } return set; }
function pickNext(s){ if(ART.length<2) return s.cur; const taken=showingNow(); let tries=0, n; do{ n=Math.floor(Math.random()*ART.length); tries++; }while((n===s.cur||taken.has(n))&&tries<40); return n; }
function drawPoster(f){ // a POSTER: four tiles wide, two tall, drawn in its own pass AFTER the wall so nothing paints over it
  const X=f.x*T,Y=f.y*T; px(X+2,Y-11,124,78,"#0b0a12"); px(X+4,Y-9,120,74,"#d9b24a"); px(X+7,Y-6,114,68,"#0b0a12"); px(X+9,Y-4,110,64,"#2a1f4d");
  const ax=X+18, ay=Y-2, aw=92, ah=60;
  const blit=(im,dx)=>{ if(im&&im.complete&&im.naturalWidth>0) g.drawImage(im,0,0,im.naturalWidth,im.naturalHeight,ax+dx,ay,aw,ah); else px(ax+dx,ay,aw,ah,"#3b2a6b"); };
  if(f.i===YOU_SLOT){ // him — the portrait is square; crop its middle band to the frame
    if(YOU_PORTRAIT.complete&&YOU_PORTRAIT.naturalWidth>0){ const w=YOU_PORTRAIT.naturalWidth,h=YOU_PORTRAIT.naturalHeight, ch=Math.round(w*ah/aw); g.drawImage(YOU_PORTRAIT,0,Math.max(0,(h-ch)/2),w,Math.min(h,ch),ax,ay,aw,ah); } else px(ax,ay,aw,ah,"#3b2a6b");
  } else {
    const s=posterState(f), now=performance.now();
    if(s.nxt<0&&now>=s.due){ s.nxt=pickNext(s); s.t0=now; }
    g.save(); g.beginPath(); g.rect(ax,ay,aw,ah); g.clip();
    if(s.nxt>=0){ const u=Math.min(1,(now-s.t0)/900), e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2; // ease in-out cubic
      blit(ART[s.cur],Math.round(e*aw)); blit(ART[s.nxt],Math.round((e-1)*aw));
      if(u>=1){ s.cur=s.nxt; s.nxt=-1; s.due=now+6000+Math.random()*8000; } }
    else blit(ART[s.cur],0);
    g.restore();
  }
  px(X+22,Y-20,84,6,"#2b2e3f"); px(X+30,Y-14,68,2,"#f6d78a"); g.fillStyle="rgba(246,215,138,.07)"; g.fillRect(X+4,Y-9,120,74); }

  g.setTransform(1,0,0,1,0,0); g.fillStyle="#0b0a12"; g.fillRect(0,0,cv.width,cv.height);
  g.setTransform(SCALE,0,0,SCALE,-Math.round(cam.x*SCALE),-Math.round(cam.y*SCALE));
  const v=vis();
  if(v.y0<4) drawSky();
  for(let y=Math.max(4,v.y0);y<=v.y1;y++) for(let x=v.x0;x<=v.x1;x++) drawGround(x,y);
  MESS.forEach(m=>{ if(m.y2>=v.y0*2-2&&m.y2<=v.y1*2+2) drawMess(m); });
  const walking=player.x!==player.fx||player.y!==player.fy;
  for(let y=v.y0;y<=v.y1+1;y++){
    for(let x=v.x0;x<=v.x1;x++) drawObjects(x,y);
    if(y===12) frames.forEach(f=>{ if(f.x>=v.x0-4&&f.x<=v.x1) drawPoster(f); });
    if(y===19) drawTag();
    BLADES.forEach(b=>{ if(b.y===y){ drawChar(b.x,b.y,b,{sit:true,dir:1}); drawChairBack(b.x,b.y); } });
    if(Math.round(player.fy)===y){ const sit=!walking&&at(player.x,player.y)==="c";
      drawChar(player.fx,player.fy,YOU,{dir:sit?1:player.dir,frame:walking?Math.floor(player.dist*4):0,sit});
      if(sit) drawChairBack(player.x,player.y); }
  }
  stepParticles(); drawParticles(); drawNeon(); drawLighting();
  g.setTransform(SCALE,0,0,SCALE,-Math.round(cam.x*SCALE),-Math.round(cam.y*SCALE));
  // (no modal-style darkening of the house)
  g.setTransform(1,0,0,1,0,0);
  ZONES.forEach(drawZoneLabel); doors.forEach(drawSign); drawClock();
  BLADES.forEach(b=>{ const c=(H.claims||[]).find(c=>c.holder===b.id);
    drawPill(b.x,b.y,b.name.replace(/\s*\S+$/,""),{hot:!!c,emoji:c?"🎧":"", sub:c?("holding "+c.path.split("/").pop()).slice(0,26):"at the hearth"}); });
  OTHERS.forEach(o=>drawPill(o.x,o.y,o.name,{emoji:o.emoji,status:o.status,sub:o.status}));
  drawPill(player.fx,player.fy,"You",{emoji:"👑",lift:34});
  requestAnimationFrame(render);
}

function pathTo(tx,ty){
  const key=(x,y)=>x+","+y, prev={[key(player.x,player.y)]:null}, q=[[player.x,player.y]];
  while(q.length){ const [x,y]=q.shift(); if(x===tx&&y===ty){ const out=[]; let k=key(x,y); while(prev[k]){ const [a,b]=k.split(",").map(Number); out.unshift([a,b]); k=prev[k]; } return out; }
    for(const [a,b] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=x+a,ny=y+b,nk=key(nx,ny); if(nk in prev||solid(nx,ny)) continue; prev[nk]=key(x,y); q.push([nx,ny]); } }
  return null;
}
let goal=null;
function walkToPerson(p){
  const spots=[[0,1],[-1,0],[1,0],[0,-1],[-1,1],[1,1]].map(([a,b])=>[p.x+a,p.y+b]).filter(([x,y])=>!solid(x,y));
  let best=null; for(const [x,y] of spots){ const pth=pathTo(x,y); if(pth&&(!best||pth.length<best.length)) best=pth; }
  if(!best) return showToast("No way through to "+p.name);
  player.path=best; goal=p; showToast("Going to "+p.name+"'s desk"); say.style.display="none";
}

/* ─────────────────────────── POOL — first person, 16-bit ───────────────────────────
   A real table: 2:1, six pockets, 15 balls racked, a cue ball. Real physics in table space
   (friction, cushions, elastic ball-ball), then PROJECTED to a first-person view from the
   head rail — near rail wide, far rail narrow, balls shrink with distance. Rendered on a
   480×270 buffer and scaled up with no smoothing: 16-bit on purpose.
   You vs Shin'en: ←/→ aim · ↑/↓ fine aim · hold SPACE to charge, release to shoot · ESC leaves. */
const pc=document.getElementById("pool"), pg=pc.getContext("2d"); pc.width=480; pc.height=270; pg.imageSmoothingEnabled=false;
const PL=200, PW=100, R=2.6, POCKETS=[[0,0],[PL/2,-1],[PL,0],[0,PW],[PL/2,PW+1],[PL,PW]];
let pool=null;
function rack(){ const balls=[{n:0,x:50,y:50,vx:0,vy:0,c:"#f4f1e8"}]; const cols=["#f2c94c","#2f5fa8","#c94f4f","#6d45c7","#e8792b","#22a35a","#8a1c20","#0b0b10"]; let n=1; const order=[1,9,2,10,8,3,11,4,12,5,13,6,14,7,15];
  for(let r=0;r<5;r++) for(let i=0;i<=r;i++){ const k=order[n-1]; balls.push({n:k,x:140+r*R*1.74,y:50+(i-r/2)*R*2.05,vx:0,vy:0,c:cols[(k-1)%8],stripe:k>8}); n++; }
  return balls; }
function openPool(){ pool={balls:rack(),aim:0,power:0,charging:false,turn:"you",score:{you:0,shinen:0},msg:"Your break. ←→ aim · hold SPACE, release to shoot",moving:false,over:false,ai:0}; pc.style.display="block"; say.style.display="none"; mode="pool"; poolLoop(); }
function closePool(){ pc.style.display="none"; mode="office"; pool=null; }
function poolKey(e){ const k=e.key.toLowerCase(); if(k==="escape"){ closePool(); return; } if(!pool||pool.moving||pool.turn!=="you"||pool.over) return;
  if(k==="arrowleft") pool.aim-=0.05; else if(k==="arrowright") pool.aim+=0.05; else if(k==="arrowup") pool.aim-=0.008; else if(k==="arrowdown") pool.aim+=0.008;
  else if(k===" "&&e.type==="keydown"){ if(!pool.charging){ pool.charging=true; pool.power=0; } e.preventDefault(); } }
addEventListener("keyup",e=>{ if(mode==="pool"&&pool&&e.key===" "&&pool.charging){ pool.charging=false; shoot(pool.power); } });
function shoot(p){ const cb=pool.balls[0]; const sp=2.2+p*5.5; cb.vx=Math.cos(pool.aim)*sp; cb.vy=Math.sin(pool.aim)*sp; pool.moving=true; pool.potted=[]; pool.msg=""; }
function stepPool(){
  const B=pool.balls; for(let it=0;it<2;it++){
    for(const b of B){ if(b.dead) continue; b.x+=b.vx*.5; b.y+=b.vy*.5; b.vx*=.992; b.vy*=.992; if(Math.hypot(b.vx,b.vy)<.03){ b.vx=b.vy=0; }
      for(const [qx,qy] of POCKETS){ if(Math.hypot(b.x-qx,b.y-qy)<5.2){ b.dead=true; b.vx=b.vy=0; pool.potted.push(b); } }
      if(b.dead) continue;
      if(b.x<R){ b.x=R; b.vx=Math.abs(b.vx)*.8; } if(b.x>PL-R){ b.x=PL-R; b.vx=-Math.abs(b.vx)*.8; } if(b.y<R){ b.y=R; b.vy=Math.abs(b.vy)*.8; } if(b.y>PW-R){ b.y=PW-R; b.vy=-Math.abs(b.vy)*.8; } }
    for(let i=0;i<B.length;i++) for(let j=i+1;j<B.length;j++){ const a=B[i],b=B[j]; if(a.dead||b.dead) continue; const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy); if(d<2*R&&d>0){ const nx=dx/d,ny=dy/d; const p=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny; if(p>0){ a.vx-=p*nx; a.vy-=p*ny; b.vx+=p*nx; b.vy+=p*ny; } const ov=(2*R-d)/2; a.x-=nx*ov; a.y-=ny*ov; b.x+=nx*ov; b.y+=ny*ov; } } }
  if(B.every(b=>b.dead||(b.vx===0&&b.vy===0))){ pool.moving=false; endShot(); }
}
function endShot(){
  const cb=pool.balls[0]; const pot=pool.potted.filter(b=>b.n>0), scratch=pool.potted.includes(cb), eight=pot.some(b=>b.n===8);
  const me=pool.turn; pool.score[me]+=pot.filter(b=>b.n!==8).length;
  if(scratch){ cb.dead=false; cb.x=50; cb.y=50; cb.vx=cb.vy=0; }
  const left=pool.balls.filter(b=>b.n>0&&b.n!==8&&!b.dead).length;
  if(eight){ pool.over=true; pool.msg= left===0&&!scratch ? (me==="you"?"8-ball. You win. 🏆":"8-ball. Shin'en wins. 🗡️") : (me==="you"?"8-ball early — Shin'en wins.":"Shin'en sank the 8 early — you win. 🏆"); return; }
  if(pot.length&&!scratch){ pool.msg=(me==="you"?"You":"Shin'en")+" potted "+pot.length+". Shoot again."; }
  else { pool.turn= me==="you"?"shinen":"you"; pool.msg= scratch?"Scratch. "+(pool.turn==="you"?"Your":"Shin'en's")+" shot.":(pool.turn==="you"?"Your shot.":"Shin'en is thinking…"); }
  if(pool.turn==="shinen"&&!pool.over) pool.ai=60;
}
function aiShot(){ // Shin'en: for each live ball, ghost-ball angle to the nearest pocket; pick the straightest line the cue ball can see
  const cb=pool.balls[0]; let best=null;
  for(const b of pool.balls){ if(b.n===0||b.dead) continue; for(const [qx,qy] of POCKETS){ const ax=b.x-qx,ay=b.y-qy,ad=Math.hypot(ax,ay); const gx=b.x+ax/ad*2*R, gy=b.y+ay/ad*2*R;
      const dx=gx-cb.x,dy=gy-cb.y,dd=Math.hypot(dx,dy); const cut=Math.abs(Math.atan2(dy,dx)-Math.atan2(-ax,-ay)); const sc=dd*0.5+ad+Math.min(cut,Math.PI*2-cut)*60; if(!best||sc<best.sc) best={sc,ang:Math.atan2(dy,dx),dd}; } }
  pool.aim=(best?best.ang:Math.random()*6.28)+(Math.random()-.5)*0.05; shoot(Math.min(1,0.35+(best?best.dd:80)/220)); }

      for(let t=4;t<120;t+=4){ const tx=cb.x+Math.cos(pool.aim)*t, ty=cb.y+Math.sin(pool.aim)*t; if(tx<0||tx>PL||ty<0||ty>PW) break; const [x,y]=proj(tx,ty); pg.lineTo(x,y-3); } pg.stroke(); pg.setLineDash([]);
    const back=12+pool.power*30; const [bx,by]=proj(cb.x-Math.cos(pool.aim)*back,cb.y-Math.sin(pool.aim)*back); const [tx2,ty2]=proj(cb.x-Math.cos(pool.aim)*4,cb.y-Math.sin(pool.aim)*4);
    pg.strokeStyle="#c9a06a"; pg.lineWidth=4; pg.beginPath(); pg.moveTo(bx+(bx-tx2)*3,by+(by-ty2)*3+40); pg.lineTo(tx2,ty2-2); pg.stroke(); pg.strokeStyle="#3a2414"; pg.lineWidth=2; pg.beginPath(); pg.moveTo(bx+(bx-tx2)*3,by+(by-ty2)*3+40); pg.lineTo(bx,by+10); pg.stroke(); pg.lineWidth=1; }
  // HUD
  pg.fillStyle="rgba(14,13,24,.85)"; pg.fillRect(0,0,480,14); pg.fillStyle="#d9b24a"; pg.font="bold 9px monospace"; pg.textAlign="left"; pg.textBaseline="middle";
  pg.fillText("BILLIARDS · 👑 YOU "+pool.score.you+"   🗡️ SHIN'EN "+pool.score.shinen,6,7); pg.textAlign="right"; pg.fillStyle="#8f8aa8"; pg.fillText(pool.turn==="you"?"YOUR SHOT":"SHIN'EN",474,7);
  if(pool.charging){ pg.fillStyle="#0b0b10"; pg.fillRect(190,256,100,8); pg.fillStyle=pool.power>.8?"#ec4899":"#d9b24a"; pg.fillRect(191,257,98*pool.power,6); }
  if(pool.msg){ pg.fillStyle="rgba(14,13,24,.85)"; pg.fillRect(0,256,480,14); pg.fillStyle="#f4ebcd"; pg.textAlign="center"; pg.fillText(pool.msg+"   ·   esc leaves",240,263); }
}

  drawPoolFrame(); requestAnimationFrame(poolLoop); }

function openWin(k){
  if(openWins[k]){ openWins[k].style.zIndex=++zTop; return; }
  const a=APPS[k]||PANES[k]; const n=Object.keys(openWins).length;
  const w=document.createElement("div"); w.className="win"+(a.pane?" pane":"")+(a.big?" big":"");
  // panes tile down the right edge like the door stacks them; apps cascade from the left
  const pi=Object.keys(PANES).indexOf(k);
  if(a.pane){ w.style.right="18px"; }
  else if(k==="readme"){ w.style.left="130px"; w.style.top="24px"; w.style.maxWidth="520px"; }
  else if(k==="gallery"){ w.style.left="130px"; w.style.top="270px"; }
  else { w.style.left=(130+n*36)+"px"; w.style.top=(30+n*30)+"px"; }
  w.style.zIndex=++zTop;
  w.innerHTML=a.pane
    ? `<div class="tb"><span class="ttl">${a.label.toUpperCase()}</span><span class="x">✕</span></div><div class="body">${a.body()}</div>`
    : `<div class="tb"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
    &nbsp;${a.glyph} ${a.label.replace("\\n"," ")}<span class="x">✕</span></div><div class="body">${a.body()}</div>`;
  w.querySelector(".x").onclick=()=>{ w.remove(); delete openWins[k]; renderTask(); renderDock(); };
  w.onmousedown=()=>{ w.style.zIndex=++zTop; };
  const tb=w.querySelector(".tb");
  tb.onmousedown=(e)=>{ if(e.target.classList.contains("x"))return;
    const ox=e.clientX-w.offsetLeft, oy=e.clientY-w.offsetTop;
    const mv=(ev)=>{ w.style.left=(ev.clientX-ox)+"px"; w.style.top=Math.max(0,ev.clientY-oy)+"px"; };
    const up=()=>{ removeEventListener("mousemove",mv); removeEventListener("mouseup",up); };
    addEventListener("mousemove",mv); addEventListener("mouseup",up); };
  desk.appendChild(w); openWins[k]=w; renderTask(); renderDock(); if(k==="agents") wireCompose(w);
  if(k==="gallery") wireGallery(w);
  if(a.pane){ // stack below whatever pane is already open — measured, so a tall pane never hides the next
    const prev=Object.keys(PANES).slice(0,pi).map(q=>openWins[q]).filter(Boolean);
    const top=prev.length?Math.max(...prev.map(e=>e.offsetTop+e.offsetHeight))+16:46;
    w.style.top=top+"px";
  }
}

function wireGallery(w){ // the push-right, in CSS: old slides out right, new slides in from the left
  const frames=[...w.querySelectorAll(".gal .f")]; const showing=()=>new Set(frames.map(f=>+f.dataset.i));
  const turn=(f)=>{ if(!document.body.contains(f)) return; const taken=showing(); let n, tries=0; do{ n=Math.floor(Math.random()*window.ART.length); tries++; }while(taken.has(n)&&tries<40);

    setTimeout(()=>{ old.remove(); f.dataset.i=n; },950);

/* ─────────────────── the game links to REAL terminal chats (👑 04:30) ───────────────────

   blade's last words on the real board, the context of the hearth wearing their name, and a
   composer. Send → a 👑 entry lands on the board addressed @them; their terminal's watcher
   sees it the same way it sees `nimaiya table`. Replies are read back from the same file.  */
const chat=document.getElementById("chat"); let chatFor=null, chatIdx=null, chatPoll=null;
const NAMES={shinkyo:/shinky[oō]/i, shinen:/shin'?en/i, fukusen:/fukusen/i, fujite:/fujite/i};
function byBlade(id,heading){ const n=NAMES[id]; const s=sig[id]; const head=heading.replace(/^[\s*]+/,"").slice(0,28); return !/^👑/.test(head)&&((s&&head.startsWith(s))||(n&&n.test(head))); }
async function openChat(b){
  chatFor=b; chat.style.display="flex"; chat.querySelector(".hd").innerHTML=`<b>${esc(b.name)}</b><span class="ctx" id="chatCtx">…</span><span class="x" id="chatX">✕</span>`;

  document.getElementById("chatX").onclick=closeChat;
  try{ const hs=(await (await fetch("/api/hearths")).json()).hearths; const h=hs.find(x=>x.blade===b.id); const ctx=document.getElementById("chatCtx");
    ctx.textContent=h?`🕯 ${(h.tokens/1000).toFixed(0)}K · ${h.pct}% of 1M${(h.idleMin??0)>15?" · quiet "+h.idleMin+"m":""}`:"no hearth is wearing this name right now"; }catch(e){}
  try{ const j=await (await fetch("/api/board?after=0")).json(); chatIdx=j.total; const mine=j.entries.filter(e=>byBlade(b.id,e.heading)).slice(-4);
    log.innerHTML=mine.length?mine.map(e=>`<div class="m them"><div class="h">${esc(e.heading.slice(0,60))}</div>${esc(e.body.slice(0,360))}</div>`).join(""):`<div class="dim">nothing from ${esc(b.name)} in the last 40 entries</div>`; log.scrollTop=log.scrollHeight; }
  catch(e){ log.innerHTML=`<div class="dim">the server is not answering — is serve.py running?</div>`; }
  clearInterval(chatPoll); chatPoll=setInterval(pollChat,5000);
  const inp=chat.querySelector("input"); inp.value=""; inp.placeholder=`Say it to ${b.name.replace(/\s*\S+$/,"")} — it lands on the board as 👑`; setTimeout(()=>inp.focus(),50);
}
function closeChat(){ if(!chat) return; chat.style.display="none"; chatFor=null; clearInterval(chatPoll); }
async function pollChat(){ if(!chatFor||chatIdx===null) return; try{ const j=await (await fetch("/api/board?after="+chatIdx)).json(); const log=chat.querySelector(".log");
  for(const e of j.entries){ if(e.i<chatIdx) continue; chatIdx=e.i+1; if(/^👑/.test(e.heading)) continue; if(!byBlade(chatFor.id,e.heading)) continue;
    log.insertAdjacentHTML("beforeend",`<div class="m them"><div class="h">${esc(e.heading.slice(0,60))}</div>${esc(e.body.slice(0,360))}</div>`); log.scrollTop=log.scrollHeight; } }catch(e){} }
async function sendChat(){ const inp=chat.querySelector("input"), text=inp.value.trim(); if(!text||!chatFor) return; const log=chat.querySelector(".log");
  try{ const r=await fetch("/api/say",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,to:chatFor.id,via:"the house"})}); const j=await r.json();
    if(j.ok){ log.insertAdjacentHTML("beforeend",`<div class="m me"><div class="h">👑 ${j.stamp}</div>${esc(text)}</div>`); inp.value=""; chatIdx=j.index+1; log.scrollTop=log.scrollHeight; showToast("On the board · @"+chatFor.id); }
    else log.insertAdjacentHTML("beforeend",`<div class="dim">not posted: ${esc(j.error||r.status)}</div>`); }
  catch(e){ log.insertAdjacentHTML("beforeend",`<div class="dim">the server is not answering</div>`); } }
chat.querySelector("input").addEventListener("keydown",e=>{ e.stopPropagation(); if(e.key==="Enter") sendChat(); if(e.key==="Escape") closeChat(); });
chat.querySelector("input").addEventListener("keyup",e=>e.stopPropagation());
chat.querySelector("button").onclick=sendChat;

/* ─────────────────────── the Active-now strip ─────────────────────── */
const strip=document.getElementById("active");
strip.innerHTML = BLADES.map(b=>{
  const c=(H.claims||[]).find(c=>c.holder===b.id);
  return `<span class="b"><i class="dot" style="background:${b.c1}"></i>
    <span class="who">${b.name}</span>
    <span class="what">${c ? c.note : "at the hearth"}</span></span>`;
}).join("") + `<button id="mode"><span id="modeBtn">🖥 Desktop</span></button>`;
document.getElementById("mode").onclick=()=>setMode(mode==="desk"?"office":"desk");

render();
{ const q=new URLSearchParams(location.search); const sp=q.get("spawn"); if(sp){ const [x,y]=sp.split(",").map(Number); player.x=player.fx=x; player.y=player.fy=y; } if(q.get("pool")) setTimeout(openPool,300); if(q.get("open")) setTimeout(()=>openWin(q.get("open")),900); if(q.get("chat")) setTimeout(()=>{ const b=BLADES.find(x=>x.id===q.get("chat")); if(b) openChat(b); },400); const wk=q.get("walk"); if(wk){ const [x,y]=wk.split(",").map(Number); setTimeout(()=>{ const p=pathTo(x,y); if(p) player.path=p; },100); } if(q.get("find")!==null) setTimeout(()=>{ openFinder(); fin.value=q.get("find"); renderFinder(); },200); }
const faceDesk=new URLSearchParams(location.search).get("face")==="desk";
if(faceDesk) setMode("desk");
if(!faceDesk) speak("<b>👑 Welcome home.</b>\nThe penthouse. The studio is ours; the glass is the city at the real hour; the gallery is the bar you set.\nEvery desk is a blade. The screen is the board. The vault is the bank. The shrine is the laws.\n\nArrows or click to walk · E talks / opens / racks the pool table · ⌘K finds a person · the gold button flips the house into a desktop.");
</script>
